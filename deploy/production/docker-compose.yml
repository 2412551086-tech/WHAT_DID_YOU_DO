services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: familyguard
      POSTGRES_USER: familyguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyguard -d familyguard"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - private

  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - production.env
    depends_on:
      database:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        pnpm --filter @what-did-you-do/backend exec prisma migrate deploy
        && pnpm --filter @what-did-you-do/backend exec prisma db seed
        && node backend/dist/main.js
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - private

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - private

networks:
  private:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
